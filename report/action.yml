name: 'Pipeline Report (esteira aprimorada)'
description: 'Uma issue por ferramenta que falhou, deduplicada por fingerprint dos achados, com card no board do projeto'
# Uso no workflow (job que roda depois de todas as verificações):
#   report:
#     if: always() && (github.ref_name == 'staging' || github.ref_name == 'esteira_aprimorada')
#     needs: [<jobs de verificação>, trivy-image, build]
#     permissions:
#       contents: read
#       issues: write
#       actions: read          # lê steps e artefatos do run
#     steps:
#       - uses: geosiap/yaml-template/report@main
#         with:
#           app-id: ${{ secrets.APP_ID }}
#           app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
#           needs-json: ${{ toJSON(needs) }}
#
# Convenção: o artefato de cada job se chama "<job>-report" (exceção conhecida: trivy -> trivy-iac-report).
# Outros nomes podem ser passados em artifact-map, ex.: '{"lint": "eslint-report"}'.
#
# Por job que falhou:
#   - mesmo fingerprint de uma issue aberta (labels ci-failure + esteira:<job>) -> comenta "reincidência";
#   - fingerprint diferente -> issue nova com label esteira:erro-novo e link para a anterior;
#   - nenhuma issue aberta -> issue nova + card no board.
# Obs.: o board do GitHub Projects pode levar dezenas de minutos para exibir cards adicionados via API;
# a lateral da issue (Projects) mostra o vínculo na hora.

inputs:
  app-id:
    description: 'ID da GitHub App usada para criar issues e cards'
    required: true
  app-private-key:
    description: 'Chave privada da GitHub App'
    required: true
  needs-json:
    description: 'JSON dos resultados dos jobs — passe toJSON(needs) no workflow'
    required: true
  board-number:
    description: 'Número do board (GitHub Project V2 da organização)'
    required: false
    default: '33'
  status-column:
    description: 'Valor do campo Status para os cards novos'
    required: false
    default: 'Security issues'
  artifact-map:
    description: 'JSON {job: nome-do-artefato} para jobs fora da convenção <job>-report'
    required: false
    default: '{}'

runs:
  using: composite
  steps:
    - name: Gerar token da GitHub App
      id: app-token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ github.repository_owner }}

    - name: Baixar os relatórios (artefatos) do run
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        path: ${{ runner.temp }}/esteira-artifacts

    - name: Registrar falhas (issue por ferramenta + fingerprint + board)
      shell: bash
      env:
        RUN_TOKEN: ${{ github.token }}
        APP_TOKEN: ${{ steps.app-token.outputs.token }}
        NEEDS_JSON: ${{ inputs.needs-json }}
        ARTIFACTS_DIR: ${{ runner.temp }}/esteira-artifacts
        BOARD_NUMBER: ${{ inputs.board-number }}
        STATUS_COLUMN: ${{ inputs.status-column }}
        ARTIFACT_MAP: ${{ inputs.artifact-map }}
      run: python3 "${{ github.action_path }}/esteira_report.py"
