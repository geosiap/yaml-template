# Esteira aprimorada — reusable workflow.
#
# Só o que pode afetar o código de verdade (sem lint/estilo):
#   Testes unitários · SAST (semgrep + brakeman em Rails + bandit/flake8 em Python) · Dependências e Dockerfile (trivy)
#   · Segredos (gitleaks) · Imagem (trivy-image)
#
# Cada job fica vermelho quando há achado (sem bloquear build/deploy — quem chama NÃO deve pôr o deploy em
# needs deste job) e, no fim, o job "report" abre uma issue por ferramenta que falhou (dedup por fingerprint)
# + card no board, e escreve um resumo do run (aba Summary).
#
# Testes são "adormecidos": sem arquivos de teste no projeto o job passa (verde) e o resumo diz "sem testes".
# Só fica vermelho se existirem testes e algum falhar.
#
# Uso no projeto (depois do job build):
#
#   esteira:
#     needs: build
#     if: always() && (github.ref_name == 'staging' || github.ref_name == 'esteira_aprimorada')
#     permissions:
#       contents: read
#       issues: write
#       actions: read
#     uses: geosiap/yaml-template/.github/workflows/esteira.yml@main
#     with:
#       stacks: 'rails angular'                 # rails | angular | laravel | php-legado | python
#       build-result: ${{ needs.build.result }}
#       docker-login: ${{ vars.DOCKER_LOGIN }}
#       images: '[{"name":"backend","ref":"<registry>/<projeto>:backend-<tag>.<run>"}]'  # name vazio se for imagem única
#       ruby-version: '3.1.0'
#     secrets: inherit                          # LIB_TOKEN, DOCKER_PASSWORD, APP_ID, APP_PRIVATE_KEY
#
# Cada job usa uma action de geosiap/yaml-template/esteira/<ferramenta> e publica o artefato <job>-report.

name: Esteira aprimorada

on:
  workflow_call:
    inputs:
      stacks:
        description: 'Stacks do projeto, separadas por espaço: rails angular laravel php-legado python'
        type: string
        required: true
      skip:
        description: 'Jobs a não rodar, separados por espaço: testes sast trivy gitleaks trivy-image'
        type: string
        default: ''
      # ── comuns ──
      semgrep-configs:
        description: 'Vazio = derivado das stacks (p/ruby, p/typescript, p/php, p/python) + p/owasp-top-ten'
        type: string
        default: ''
      semgrep-target:
        description: 'Caminho do semgrep, aceita flags (ex.: "application/ --exclude _vendors")'
        type: string
        default: '.'
      images:
        description: 'JSON [{"name": "...", "ref": "registry/projeto:tag"}] das imagens publicadas pelo build ("[]" = sem trivy-image)'
        type: string
        default: '[]'
      docker-login:
        description: 'vars.DOCKER_LOGIN do projeto (senha vem de secrets.DOCKER_PASSWORD)'
        type: string
        default: ''
      build-result:
        description: 'needs.build.result — o trivy-image só roda se o build passou'
        type: string
        default: 'success'
      # ── Rails (testes e brakeman) ──
      backend-dir:
        type: string
        default: 'backend'
      ruby-version:
        description: 'Versão EXATA do Gemfile (ex.: 3.1.0)'
        type: string
        default: ''
      rails-system-deps:
        type: string
        default: 'libpq-dev'
      bundle-auth:
        description: 'Autenticação do bundle nas gems privadas — espelhe o Dockerfile ($LIB_TOKEN disponível)'
        type: string
        default: 'bundle config set --global rubygems.pkg.github.com "$LIB_TOKEN"'
      # ── testes: PHP ──
      php-version:
        description: 'PHP da aplicação (o do Dockerfile)'
        type: string
        default: '8.2'
      php-extensions:
        type: string
        default: 'mbstring, xml'
      phpunit-version:
        description: 'Só php-legado (Laravel usa o do composer)'
        type: string
        default: '8.5'
      # ── Python (testes, bandit, flake8) ──
      python-version:
        type: string
        default: '3.11'
      python-requirements:
        type: string
        default: 'requirements.txt'
      # ── board ──
      board-number:
        type: string
        default: '33'
      status-column:
        type: string
        default: 'Security issues'

jobs:
  # ─── Testes unitários (adormecidos até existirem testes) ──────────────────────
  # Um job só: cada stack é um step (step ignorado não aparece no grafo, job ignorado aparece).
  testes:
    name: Testes unitários
    if: >-
      !contains(format(' {0} ', inputs.skip), ' testes ') && (
      contains(format(' {0} ', inputs.stacks), ' rails ') ||
      contains(format(' {0} ', inputs.stacks), ' laravel ') ||
      contains(format(' {0} ', inputs.stacks), ' php-legado ') ||
      contains(format(' {0} ', inputs.stacks), ' python '))
    runs-on: ubuntu-latest
    outputs:
      ran: ${{ steps.rspec.outputs.ran == 'true' || steps.phpunit.outputs.ran == 'true' || steps.pytest.outputs.ran == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: RSpec
        id: rspec
        if: contains(format(' {0} ', inputs.stacks), ' rails ')
        uses: geosiap/yaml-template/esteira/rspec@main
        with:
          ruby-version: ${{ inputs.ruby-version }}
          working-directory: ${{ inputs.backend-dir }}
          system-deps: ${{ inputs.rails-system-deps }}
          bundle-auth: ${{ inputs.bundle-auth }}
          lib-token: ${{ secrets.LIB_TOKEN }}
      - name: PHPUnit
        id: phpunit
        if: ${{ !cancelled() && (contains(format(' {0} ', inputs.stacks), ' laravel ') || contains(format(' {0} ', inputs.stacks), ' php-legado ')) }}
        uses: geosiap/yaml-template/esteira/phpunit@main
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.php-extensions }}
          laravel: ${{ contains(format(' {0} ', inputs.stacks), ' laravel ') }}
          phpunit-version: ${{ inputs.phpunit-version }}
      - name: pytest
        id: pytest
        if: ${{ !cancelled() && contains(format(' {0} ', inputs.stacks), ' python ') }}
        uses: geosiap/yaml-template/esteira/pytest@main
        with:
          python-version: ${{ inputs.python-version }}
          requirements: ${{ inputs.python-requirements }}
      - name: Publicar relatório dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-report
          path: /tmp/esteira-testes
          if-no-files-found: ignore

  # ─── SAST ─────────────────────────────────────────────────────────────────────
  # Semgrep em toda stack + o SAST específico da linguagem (brakeman em Rails, bandit e flake8 em Python).
  # Matrix: uma perna por ferramenta (grafo compacto, uma issue por ferramenta, nada de job cinza).
  sast:
    name: ${{ format('SAST ({0})', matrix.tool) }}
    if: ${{ !contains(format(' {0} ', inputs.skip), ' sast ') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(format('[{{"tool":"semgrep"}}{0}{1}{2}]',
          contains(format(' {0} ', inputs.stacks), ' rails ') && ',{"tool":"brakeman"}' || '',
          contains(format(' {0} ', inputs.stacks), ' python ') && ',{"tool":"bandit"}' || '',
          contains(format(' {0} ', inputs.stacks), ' python ') && ',{"tool":"flake8"}' || '')) }}
    steps:
      - uses: actions/checkout@v4
      - name: Packs do semgrep (derivados das stacks quando não informados)
        id: cfg
        if: matrix.tool == 'semgrep'
        shell: bash
        run: |
          CFG="${{ inputs.semgrep-configs }}"
          if [ -z "$CFG" ]; then
            S=" ${{ inputs.stacks }} "
            [[ "$S" == *" rails "* ]]      && CFG="$CFG p/ruby"
            [[ "$S" == *" angular "* ]]    && CFG="$CFG p/typescript"
            [[ "$S" == *" laravel "* || "$S" == *" php-legado "* ]] && CFG="$CFG p/php"
            [[ "$S" == *" python "* ]]     && CFG="$CFG p/python"
            CFG="${CFG# } p/owasp-top-ten"
          fi
          echo "configs=$CFG" >> "$GITHUB_OUTPUT"
      - if: matrix.tool == 'semgrep'
        uses: geosiap/yaml-template/esteira/semgrep@main
        with:
          configs: ${{ steps.cfg.outputs.configs }}
          target: ${{ inputs.semgrep-target }}
      - if: matrix.tool == 'brakeman'
        uses: geosiap/yaml-template/esteira/brakeman@main
        with:
          ruby-version: ${{ inputs.ruby-version }}
          app-path: ./${{ inputs.backend-dir }}
      - if: matrix.tool == 'bandit'
        uses: geosiap/yaml-template/esteira/bandit@main
        with:
          python-version: ${{ inputs.python-version }}
      - if: matrix.tool == 'flake8'
        uses: geosiap/yaml-template/esteira/flake8@main
        with:
          python-version: ${{ inputs.python-version }}

  # ─── Dependências vulneráveis + Dockerfile/compose (um scan só) ───────────────
  trivy:
    name: Dependências e Dockerfile · Trivy
    if: ${{ !contains(format(' {0} ', inputs.skip), ' trivy ') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geosiap/yaml-template/esteira/trivy@main
        with:
          severity: 'CRITICAL,HIGH'

  # ─── Segredos no histórico do git ─────────────────────────────────────────────
  gitleaks:
    name: Segredos · Gitleaks
    if: ${{ !contains(format(' {0} ', inputs.skip), ' gitleaks ') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: geosiap/yaml-template/esteira/gitleaks@main

  # ─── CVE da imagem publicada ──────────────────────────────────────────────────
  # Um job por imagem (a action trivy-image não roda 2x no mesmo job). Imagem única: name vazio.
  trivy-image:
    name: ${{ matrix.name && format('Imagem · Trivy ({0})', matrix.name) || 'Imagem · Trivy' }}
    if: inputs.images != '[]' && inputs.build-result == 'success' && !contains(format(' {0} ', inputs.skip), ' trivy-image ')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: geosiap/yaml-template/esteira/trivy-image@main
        with:
          image: ${{ matrix.ref }}
          docker-login: ${{ inputs.docker-login }}
          docker-password: ${{ secrets.DOCKER_PASSWORD }}
          severity: 'CRITICAL,HIGH'
          artifact-name: ${{ matrix.name && format('trivy-image-{0}-report', matrix.name) || 'trivy-image-report' }}

  # ─── Report ───────────────────────────────────────────────────────────────────
  report:
    name: Resumo e issues
    if: always()
    needs: [testes, sast, trivy, gitleaks, trivy-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: geosiap/yaml-template/report@main
        with:
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          needs-json: ${{ toJSON(needs) }}
          board-number: ${{ inputs.board-number }}
          status-column: ${{ inputs.status-column }}
          job-names: >-
            {"testes": "Testes unitários", "sast": "SAST",
            "trivy": "Dependências e Dockerfile · Trivy", "gitleaks": "Segredos · Gitleaks",
            "trivy-image": "Imagem · Trivy"}
