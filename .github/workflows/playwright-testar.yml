# Playwright — roda os testes E2E no runner local (ou no GitHub, sob pedido). Reusable workflow.
#
# Um job só. Por padrão roda no runner próprio, onde browsers e bibliotecas ficam instalados entre
# execuções (ver playwright/preparar). Com "forcar-github" roda em máquina hospedada do GitHub: é o
# caminho manual para quando o runner local estiver fora do ar ou com problema.
# (Um job roda numa única máquina, então não há failover automático entre as duas.)
#
# Se os testes falharem e "issues-repo" estiver preenchido, os últimos passos comentam na issue citada
# no INÍCIO das mensagens dos commits do push ("#123 - ...", "Issue 123 - ...", "Card 123 - ...",
# merge de "origin/issue-123"). O comentário nunca bloqueia nada: cada passo dele tem continue-on-error
# e a falha do job já vem do passo dos testes.
#
# Uso no projeto (depois do deploy do ambiente testado):
#
#   playwright_test:
#     name: Playwright
#     needs: [deploy_ambiente, selecionar_testes]
#     if: needs.selecionar_testes.outputs.executar != 'nenhum'
#     uses: geosiap/yaml-template/.github/workflows/playwright-testar.yml@main
#     with:
#       base-url: https://<ambiente>/<sistema>
#       grep: ${{ needs.selecionar_testes.outputs.grep }}
#       runner-local: '["self-hosted","<label-do-runner>"]'
#       forcar-github: ${{ github.event_name == 'workflow_dispatch' && inputs.playwright_no_github }}
#       issues-repo: <org>/<repo-das-issues>      # vazio = não comenta
#     secrets:                                    # só para comentar na issue; repasse apenas estes dois
#       APP_ID: ${{ secrets.APP_ID }}
#       APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
#
# O teste usa BASE_URL do ambiente. A pasta de testes é <pasta-testes> dentro da branch <branch-testes>.
# O runner local precisa de python3 para o passo do comentário.

name: Playwright — testar

on:
  workflow_call:
    inputs:
      base-url:
        description: 'URL do sistema sob teste (vira a variável de ambiente BASE_URL dos testes)'
        type: string
        required: true
      grep:
        description: 'Regex para o --grep do Playwright (vazio = todos os testes)'
        type: string
        default: ''
      runner-local:
        description: 'Labels do runner próprio, em JSON (ex.: ["self-hosted","label"])'
        type: string
        default: '["self-hosted"]'
      forcar-github:
        description: 'true = roda em máquina hospedada do GitHub em vez do runner local'
        type: boolean
        default: false
      branch-testes:
        type: string
        default: 'qa-automacao'
      pasta-testes:
        description: 'Pasta dos testes dentro da branch de testes (onde está o package.json do Playwright)'
        type: string
        default: 'qa-automacao'
      browsers:
        description: 'Browsers a preparar, separados por espaço'
        type: string
        default: 'chromium firefox'
      timeout-minutos:
        type: number
        default: 90
      espera-sistema-segundos:
        description: 'Quanto esperar o sistema responder antes de abrir o navegador'
        type: number
        default: 300
      issues-repo:
        description: 'Repositório (org/repo) das issues a comentar quando falhar. Vazio = não comenta'
        type: string
        default: ''
      issue-teste:
        description: 'Modo teste: se preenchido, TODO comentário vai só para esta issue de issues-repo'
        type: string
        default: ''
      texto-extra:
        description: 'Linha extra no comentário (ex.: o que deixou de acontecer e como liberar manualmente)'
        type: string
        default: ''
    secrets:
      APP_ID:
        description: 'ID da GitHub App que comenta na issue (necessário só com issues-repo)'
        required: false
      APP_PRIVATE_KEY:
        description: 'Chave privada da GitHub App'
        required: false

permissions:
  contents: read

jobs:
  testar:
    name: ${{ inputs.forcar-github && 'GitHub' || 'runner local' }}
    runs-on: ${{ inputs.forcar-github && 'ubuntu-latest' || fromJSON(inputs.runner-local) }}
    timeout-minutes: ${{ inputs.timeout-minutos }}
    env:
      BASE_URL: ${{ inputs.base-url }}
      GREP: ${{ inputs.grep }}
      ESPERA: ${{ inputs.espera-sistema-segundos }}
    defaults:
      run:
        working-directory: ${{ inputs.pasta-testes }}
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ inputs.branch-testes }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ inputs.pasta-testes }}/.nvmrc

      - name: Instalar dependências
        run: npm ci

      # Runner local: cache entre execuções. GitHub: máquina nova, instala tudo.
      - name: Preparar browsers
        uses: geosiap/yaml-template/playwright/preparar@main
        with:
          working-directory: ${{ inputs.pasta-testes }}
          browsers: ${{ inputs.browsers }}
          modo: ${{ inputs.forcar-github && 'github' || 'local' }}

      - name: Aguardar o sistema responder
        run: |
          fim=$((SECONDS + ESPERA))
          while [ "$SECONDS" -lt "$fim" ]; do
            curl -sf -o /dev/null "$BASE_URL/" && exit 0
            sleep 10
          done
          echo "::error::O sistema não respondeu em $BASE_URL/ em ${ESPERA}s."
          exit 1

      - name: Listar os testes escolhidos
        run: |
          if [ -n "$GREP" ]; then npx playwright test --grep "$GREP" --list | tee lista.txt; else npx playwright test --list | tee lista.txt; fi
          { echo '### Testes que serão executados'; echo; echo '```'; cat lista.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Marca que o ambiente ficou pronto: falha ANTES daqui não é falha de teste (muda o texto do comentário).
      - name: Marcar início dos testes
        id: inicio
        run: echo "executou=true" >> "$GITHUB_OUTPUT"

      - name: Rodar testes
        run: |
          if [ -n "$GREP" ]; then npx playwright test --grep "$GREP"; else npx playwright test; fi

      - name: Publicar relatório do Playwright
        if: failure() && steps.inicio.outputs.executou == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ inputs.pasta-testes }}/playwright-report/
          retention-days: 14

      # ── Comentário na issue (só se falhou; nunca bloqueia) ──
      # O token da App é limitado ao repositório das issues (org/repo -> dono e nome).
      - name: Separar dono e repositório das issues
        id: alvo
        if: failure() && inputs.issues-repo != ''
        continue-on-error: true
        env:
          ISSUE_REPO: ${{ inputs.issues-repo }}
        run: |
          echo "dono=${ISSUE_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${ISSUE_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Gerar token da GitHub App
        id: app-token
        if: failure() && inputs.issues-repo != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.alvo.outputs.dono }}
          repositories: ${{ steps.alvo.outputs.repo }}

      - name: Comentar na issue
        if: failure() && inputs.issues-repo != ''
        continue-on-error: true
        working-directory: .
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_REPO: ${{ inputs.issues-repo }}
          ISSUE_TESTE: ${{ inputs.issue-teste }}
          TEXTO_EXTRA: ${{ inputs.texto-extra }}
          EXECUTOU: ${{ steps.inicio.outputs.executou }}
          # Push: todos os commits do push. Disparo manual: lê o commit pela API.
          COMMITS_JSON: ${{ github.event_name == 'push' && toJSON(github.event.commits.*.message) || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          python3 -I - <<'PY'
          import json, os, re, urllib.request

          API = os.environ.get('GITHUB_API_URL', 'https://api.github.com')

          def chamar(metodo, caminho, token, corpo=None):
              req = urllib.request.Request(
                  API + caminho, method=metodo,
                  data=json.dumps(corpo).encode() if corpo is not None else None,
                  headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'playwright-testar',
                           'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          mensagens = json.loads(os.environ.get('COMMITS_JSON') or '[]')
          if not mensagens:
              try:
                  c = chamar('GET', '/repos/%s/commits/%s' % (os.environ['GITHUB_REPOSITORY'], os.environ['SHA']),
                             os.environ['GITHUB_TOKEN'])
                  mensagens = [c['commit']['message']]
              except Exception as e:
                  print('::warning::não consegui ler a mensagem do commit: %s' % e)

          # Número da issue no INÍCIO da primeira linha: "#7633 - ...", "Issue 7580 - ...", "Card 6660 - ...", "7542 ..."
          INICIO = re.compile(r'^\s*(?:issue|card)?\s*#?\s*(\d{3,6})(?!\d)', re.I)
          # Merge de branch de issue: "Merge remote-tracking branch 'origin/issue-7588' into staging"
          MERGE = re.compile(r'^merge\b.*\bissue-(\d{3,6})\b', re.I)
          numeros = []
          for msg in mensagens:
              linha = (msg or '').splitlines()[0] if (msg or '').strip() else ''
              m = INICIO.match(linha) or MERGE.match(linha)
              if m and m.group(1) not in numeros:
                  numeros.append(m.group(1))
          print('Issues detectadas: %s' % (' '.join(numeros) or 'nenhuma'))

          titulo = ('Os testes de Playwright falharam.' if os.environ.get('EXECUTOU') == 'true'
                    else 'O ambiente de testes não ficou pronto: os testes nem chegaram a rodar.')

          def corpo(extra):
              rodou = os.environ.get('EXECUTOU') == 'true'
              linhas = ['❌ **%s**' % titulo, '',
                        '- Push de @%s, commit `%s`' % (os.environ['ACTOR'], os.environ['SHA'][:7]),
                        ('- Run e relatório (artefato `playwright-report`): %s' if rodou else '- Run: %s') % os.environ['RUN_URL']]
              if os.environ.get('TEXTO_EXTRA'):
                  linhas.append('- ' + os.environ['TEXTO_EXTRA'])
              if extra:
                  linhas.append(extra)
              return '\n'.join(linhas)

          repo = os.environ['ISSUE_REPO']
          teste = os.environ.get('ISSUE_TESTE', '')
          if teste:
              destinos = [(teste, '- _Modo teste_: comentário só neste card. Issues detectadas nos commits: %s'
                                  % (' '.join(numeros) or 'nenhuma'))]
          else:
              destinos = [(n, '') for n in numeros]
          if not destinos:
              print('::warning::Nenhuma issue encontrada no início das mensagens de commit; nada comentado.')
          for n, extra in destinos:
              try:
                  chamar('POST', '/repos/%s/issues/%s/comments' % (repo, n), os.environ['APP_TOKEN'], {'body': corpo(extra)})
                  print('Comentado em %s#%s' % (repo, n))
              except Exception as e:
                  print('::warning::não consegui comentar em %s#%s: %s' % (repo, n, e))
          PY
