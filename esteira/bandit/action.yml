name: 'Esteira — Bandit'
description: 'SAST específico de Python (SQL por string, command injection, cripto fraca, bind 0.0.0.0). Severidade média ou maior; artefato sast-bandit-report (JSON).'
inputs:
  python-version:
    required: false
    default: '3.11'
  exclude:
    description: 'Caminhos a excluir (separados por vírgula)'
    required: false
    default: '.git,__pycache__,venv,.venv,node_modules'
runs:
  using: composite
  steps:
    - name: Instalar Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Bandit
      shell: bash
      run: |
        pip install -q bandit
        RC=0
        bandit -r . -ll --exclude "${{ inputs.exclude }}" --format json --output /tmp/bandit-report.json || RC=$?
        jq -r '.results[] | "\(.issue_severity)\t\(.test_id) \(.test_name)\t\(.filename):\(.line_number)"' /tmp/bandit-report.json 2>/dev/null | head -100
        echo "Achados do Bandit: $(jq '.results | length' /tmp/bandit-report.json 2>/dev/null || echo '?')"
        exit $RC
    - name: Upload sast-bandit-report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sast-bandit-report
        path: /tmp/bandit-report.json
        if-no-files-found: ignore
