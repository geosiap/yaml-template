name: 'Esteira — Brakeman'
description: 'SAST específico de Rails (SQL injection, command injection, deserialização, Rails/Ruby sem suporte). Falha se houver aviso; artefato sast-brakeman-report (JSON).'
inputs:
  ruby-version:
    description: 'Versão do Ruby'
    required: true
  app-path:
    description: 'Caminho da aplicação Rails'
    required: false
    default: './backend'
runs:
  using: composite
  steps:
    - name: Instalar Ruby ${{ inputs.ruby-version }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: false
    - name: Brakeman
      shell: bash
      run: |
        gem install brakeman --no-document
        brakeman --format json --output /tmp/brakeman-report.json --no-progress "${{ inputs.app-path }}" || true
        N=$(jq '.warnings | length' /tmp/brakeman-report.json 2>/dev/null || echo 0)
        echo "Avisos do Brakeman: $N"
        jq -r '.warnings[] | .warning_type' /tmp/brakeman-report.json 2>/dev/null | sort | uniq -c | sort -rn | head -15
        [ "$N" -eq 0 ]
    - name: Upload sast-brakeman-report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sast-brakeman-report
        path: /tmp/brakeman-report.json
        if-no-files-found: ignore
