name: 'Trivy — dependências e Dockerfile'
description: 'trivy fs: dependências vulneráveis (lockfiles) + misconfiguração de Dockerfile/compose. Só reporta o que tem correção disponível. Artefato trivy-report (JSON).'

inputs:
  severity:
    description: 'Severidades a reportar (separadas por vírgula)'
    required: false
    default: 'CRITICAL,HIGH'
  scan-path:
    description: 'Caminho a ser escaneado'
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Instalar Trivy CLI
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y wget apt-transport-https gnupg
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
          | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list
        sudo apt-get update -qq
        sudo apt-get install -y trivy

    - name: Trivy — dependências (vuln) + Dockerfile/compose (misconfig)
      shell: bash
      run: |
        RC=0
        trivy fs \
          --scanners vuln,misconfig \
          --severity "${{ inputs.severity }}" \
          --ignore-unfixed \
          --exit-code 1 \
          --format json \
          --output /tmp/trivy-report.json \
          "${{ inputs.scan-path }}" || RC=$?
        # versão legível no log do job
        trivy convert --format table --severity "${{ inputs.severity }}" /tmp/trivy-report.json || true
        exit $RC

    - name: Upload trivy-report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trivy-report
        path: /tmp/trivy-report.json
        if-no-files-found: ignore
