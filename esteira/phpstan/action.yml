name: 'Esteira — PHPStan'
description: 'Análise estática PHP (config no phpstan.neon do projeto); artefato phpstan-report (JSON).'
inputs:
  php-version:
    description: 'PHP que roda o PHPStan (a versão analisada fica no phpVersion do phpstan.neon)'
    required: false
    default: '8.2'
  extensions:
    required: false
    default: 'mbstring, xml'
  composer:
    description: "'true' para composer install antes (autoload do projeto)"
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Instalar PHP ${{ inputs.php-version }} + PHPStan
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.extensions }}
        tools: phpstan
    - name: Instalar dependências via Composer
      if: ${{ inputs.composer == 'true' }}
      shell: bash
      run: composer install --prefer-dist --no-interaction --no-progress
    - name: PHPStan — análise estática
      shell: bash
      run: |
        RC=0
        phpstan analyse --configuration phpstan.neon --no-progress --memory-limit=1G \
          --error-format=json > /tmp/phpstan-report.json || RC=$?
        jq -r '.files | to_entries[] | .key as $f | .value.messages[] | "\($f):\(.line) \(.message)"' \
          /tmp/phpstan-report.json 2>/dev/null | head -200
        jq -c '.totals' /tmp/phpstan-report.json 2>/dev/null || cat /tmp/phpstan-report.json
        exit $RC

    - name: Upload phpstan-report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: phpstan-report
        path: /tmp/phpstan-report.json
        if-no-files-found: ignore
