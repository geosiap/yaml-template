name: 'Esteira — Flake8 (só bugs)'
description: 'Pyflakes via flake8, só o que é bug: nome não definido (F82x), erro de format string (F5xx), comparação/assert sempre verdadeiro (F6xx), sintaxe (F7xx). Sem estilo e sem import não usado. Artefato sast-flake8-report.'
inputs:
  python-version:
    required: false
    default: '3.11'
  exclude:
    required: false
    default: '.git,__pycache__,venv,.venv,node_modules'
runs:
  using: composite
  steps:
    - name: Instalar Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Flake8 (F5, F6, F7, F82)
      shell: bash
      run: |
        pip install -q flake8
        RC=0
        flake8 --select=F5,F6,F7,F82 --exclude="${{ inputs.exclude }}" --output-file=/tmp/flake8-report.txt . || RC=$?
        cat /tmp/flake8-report.txt
        exit $RC
    - name: Upload sast-flake8-report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sast-flake8-report
        path: /tmp/flake8-report.txt
        if-no-files-found: ignore
