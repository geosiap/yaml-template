name: 'Esteira — Lint do frontend'
description: 'Lint Angular/TypeScript: ng lint se houver target, senão ESLint, senão TSLint. Artefato lint-frontend-report.'
inputs:
  node-version:
    required: false
    default: '18'
  working-directory:
    required: false
    default: 'frontend'
  lib-token:
    description: 'LIB_TOKEN para pacotes @geosiap'
    required: false
    default: ''
  install-command:
    description: 'Mesmo gerenciador do Dockerfile do frontend'
    required: false
    default: 'npm install --legacy-peer-deps --no-audit --no-fund'
runs:
  using: composite
  steps:
    - name: Instalar Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - name: Configurar .npmrc para os pacotes @geosiap
      if: ${{ inputs.lib-token != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "//npm.pkg.github.com/:_authToken=${{ inputs.lib-token }}" > .npmrc
        echo "@geosiap:registry=https://npm.pkg.github.com" >> .npmrc
    - name: Instalar dependências
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.install-command }}
    - name: Lint — Angular/TypeScript
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -o pipefail
        # Relatório só com a saída do linter (stdout); stack traces (stderr) vão para o log à parte —
        # misturar os dois gerava linhas "costuradas" diferentes a cada run e instabilizava o fingerprint.
        run_lint() { "$@" 2>/tmp/lint-frontend-stderr.txt | tee /tmp/lint-frontend-report.txt; }
        RC=0
        if grep -q '"lint"' angular.json 2>/dev/null; then
          run_lint npx ng lint || RC=$?
        elif ls .eslintrc* eslint.config.* >/dev/null 2>&1; then
          run_lint npx eslint . --ext .ts,.html || RC=$?
        elif [ -f tslint.json ]; then
          run_lint npx tslint -c tslint.json -p tsconfig.json --format verbose || RC=$?
        else
          echo "Nenhuma configuração de lint encontrada" | tee /tmp/lint-frontend-report.txt
          exit 1
        fi
        if [ -s /tmp/lint-frontend-stderr.txt ]; then
          echo "::group::stderr do linter (erros de execução — não entram no relatório)"
          cat /tmp/lint-frontend-stderr.txt
          echo "::endgroup::"
        fi
        exit $RC
    - name: Upload lint-frontend-report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-frontend-report
        path: /tmp/lint-frontend-report.txt
        if-no-files-found: ignore
