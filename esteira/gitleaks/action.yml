name: 'Esteira — Gitleaks'
description: 'Secrets no histórico do git (valores mascarados). Falha se encontrar algo; artefato gitleaks-report.'
# Requer actions/checkout com fetch-depth: 0 no job.
inputs:
  version:
    description: 'Versão do gitleaks'
    required: false
    default: '8.21.2'
runs:
  using: composite
  steps:
    - name: Gitleaks — secrets no histórico do git (--redact)
      shell: bash
      run: |
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${{ inputs.version }}/gitleaks_${{ inputs.version }}_linux_x64.tar.gz" \
          | tar -xz -C /tmp gitleaks
        /tmp/gitleaks detect --source . --redact --verbose \
          --report-format json --report-path /tmp/gitleaks-report.json

    - name: Upload gitleaks-report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gitleaks-report
        path: /tmp/gitleaks-report.json
        if-no-files-found: ignore
