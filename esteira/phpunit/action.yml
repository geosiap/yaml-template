name: 'Esteira — PHPUnit'
description: 'PHPUnit, só se existirem testes (tests/**/*Test.php). Sem testes a etapa fica adormecida e passa. Laravel usa o phpunit do composer; legado usa o da tool.'
inputs:
  php-version:
    description: 'Versão de PHP da APLICAÇÃO (a do Dockerfile)'
    required: true
  extensions:
    required: false
    default: 'mbstring, xml'
  laravel:
    description: "'true': composer install + .env + key:generate + vendor/bin/phpunit"
    required: false
    default: 'false'
  phpunit-version:
    description: 'Só sem Laravel (ex.: 8.5 para PHP 7.2)'
    required: false
    default: '8.5'
outputs:
  ran:
    description: "'true' se havia testes e o PHPUnit rodou"
    value: ${{ steps.detect.outputs.has }}
runs:
  using: composite
  steps:
    - name: Procurar testes
      id: detect
      shell: bash
      run: |
        if [ -n "$(find tests test -name '*Test.php' -print -quit 2>/dev/null)" ]; then
          echo "has=true" >> "$GITHUB_OUTPUT"
        else
          echo "has=false" >> "$GITHUB_OUTPUT"
          MSG="⚪ **PHPUnit:** nenhum \`*Test.php\` em \`tests/\` — etapa adormecida (passa a rodar sozinha quando existir um teste)."
          echo "$MSG" | tee -a "$GITHUB_STEP_SUMMARY"
        fi
    - name: Instalar PHP ${{ inputs.php-version }}
      if: steps.detect.outputs.has == 'true'
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.extensions }}
        tools: ${{ inputs.laravel != 'true' && format('phpunit:{0}', inputs.phpunit-version) || '' }}
        coverage: none
    - name: Instalar dependências e preparar Laravel
      if: steps.detect.outputs.has == 'true' && inputs.laravel == 'true'
      shell: bash
      run: |
        composer install --prefer-dist --no-interaction --no-progress
        [ -f .env.example ] && cp .env.example .env
        php artisan key:generate
    - name: PHPUnit
      if: steps.detect.outputs.has == 'true'
      shell: bash
      run: |
        mkdir -p /tmp/esteira-testes
        BIN=phpunit; [ "${{ inputs.laravel }}" = "true" ] && BIN=vendor/bin/phpunit
        ARGS=(--testdox --colors=never)
        # sem phpunit.xml, aponta direto para a pasta de testes
        [ -f phpunit.xml ] || [ -f phpunit.xml.dist ] || ARGS+=(tests)
        "$BIN" "${ARGS[@]}" | tee /tmp/esteira-testes/phpunit.txt
