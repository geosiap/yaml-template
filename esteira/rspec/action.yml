name: 'Esteira — RSpec'
description: 'RSpec, só se existirem specs (*_spec.rb). Sem specs a etapa fica adormecida e passa.'
inputs:
  ruby-version:
    description: 'Versão exata do Gemfile (ex.: 3.1.0)'
    required: true
  working-directory:
    required: false
    default: 'backend'
  system-deps:
    description: 'Pacotes apt para o bundle (ex.: "libpq-dev firebird-dev")'
    required: false
    default: 'libpq-dev'
  lib-token:
    description: 'LIB_TOKEN para gems privadas @geosiap'
    required: false
    default: ''
  bundle-auth:
    description: 'Comando que autentica o bundle — espelhe o Dockerfile do projeto ($LIB_TOKEN disponível)'
    required: false
    default: 'bundle config set --global rubygems.pkg.github.com "$LIB_TOKEN"'
outputs:
  ran:
    description: "'true' se havia specs e o RSpec rodou"
    value: ${{ steps.detect.outputs.has }}
runs:
  using: composite
  steps:
    - name: Procurar specs
      id: detect
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -d spec ] && [ -n "$(find spec -name '*_spec.rb' -print -quit)" ]; then
          echo "has=true" >> "$GITHUB_OUTPUT"
        else
          echo "has=false" >> "$GITHUB_OUTPUT"
          MSG="⚪ **RSpec:** nenhum spec em \`${{ inputs.working-directory }}/spec\` — etapa adormecida (passa a rodar sozinha quando existir um \`*_spec.rb\`)."
          echo "$MSG" | tee -a "$GITHUB_STEP_SUMMARY"
        fi
    - name: Instalar Ruby ${{ inputs.ruby-version }}
      if: steps.detect.outputs.has == 'true'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ inputs.ruby-version }}
    - name: RSpec
      if: steps.detect.outputs.has == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LIB_TOKEN: ${{ inputs.lib-token }}
      run: |
        sudo apt-get update -qq && sudo apt-get install -y ${{ inputs.system-deps }}
        ${{ inputs.bundle-auth }}
        bundle install --jobs 4
        mkdir -p /tmp/esteira-testes
        bundle exec rspec --no-color --format documentation | tee /tmp/esteira-testes/rspec.txt
